spring.datasource.url=jdbc:h2:mem:easywms-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-h2.sql
easywms.jwt.secret=easywms-test-secret-must-be-at-least-32-bytes-long
easywms.jwt.expiration-seconds=3600
