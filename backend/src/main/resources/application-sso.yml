easywms:
  sso:
    enabled: true
    tenant-id: ${SSO_TENANT_ID:1001}
    web-redirect-url: ${SSO_WEB_FRONTEND_URL:${SSO_FRONTEND_REDIRECT_URL:http://localhost:5173}}
    pda-redirect-url: ${SSO_PDA_FRONTEND_URL:http://localhost:5174}
spring:
  security:
    oauth2:
      client:
        registration:
          corporate:
            provider: corporate
            client-id: ${SSO_CLIENT_ID}
            client-secret: ${SSO_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          corporate:
            issuer-uri: ${SSO_ISSUER_URI}
